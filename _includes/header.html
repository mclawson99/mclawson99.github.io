<header id="masthead">
	<h1>
  		<a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
  		<!-- <div class="mastheadspacer"/></div> -->
   		<!-- <span class="masthead-slash">/</span> -->
   		<!-- <small>{{ site.tagline }}</small> -->
	</h1>
	<nav>
		<span class="masthead-connector" aria-hidden="true"></span>
		{% if page.url != '/cv/' %}
		<a href="{{ site.url }}/cv"><div><i class="fa fa-portrait icon icon-right-space"></i>CV</div></a>
		{% endif %}
		{% if page.url != '/research/' %}
		<a href="{{ site.url }}/research"><div><i class="fa fa-flask icon icon-right-space"></i>Research</div></a>
		{% endif %}
		{% if page.url != '/teaching/' %}
		<a href="{{ site.url }}/teaching"><div><i class="fa fa-chalkboard-teacher icon icon-right-space"></i>Teaching</div></a>
		{% endif %}
	</nav>
</header>
